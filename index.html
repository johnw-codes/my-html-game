<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shear Speed</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #87CEEB;
}

/* Title Screen */

#startScreen {
    margin-top: 120px;
}

#startScreen h1 {
    font-size: 60px;
    color: darkgreen;
    margin-bottom: 10px;
}

#startScreen h2 {
    font-size: 32px;
    color: #444;
}

#startScreen p {
    font-size: 20px;
}

button {
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background-color: green;
    color: white;
}

button:hover {
    background-color: darkgreen;
}

/* Game Area */

#gameContainer {
    margin-top: 20px;
}

#score {
    font-size: 28px;
    margin-bottom: 20px;
    font-weight: bold;
}

#game {
    width: 900px;
    height: 350px;
    margin: auto;
    border: 4px solid black;
    position: relative;
    overflow: hidden;
    background:
    linear-gradient(
        to bottom,
        #87CEEB 0%,
        #87CEEB 70%,
        #4CAF50 70%,
        #4CAF50 100%
    );
}

#sheep {
    position: absolute;
    left: 120px;
    bottom: 30px;
    font-size: 70px;
}

.fence {
    position: absolute;
    bottom: 30px;
    width: 35px;
    height: 90px;
    background-color: saddlebrown;
}

/* Game Over */

#gameOver {
    margin-top: 30px;
}

.hidden {
    display: none;
}
</style>
</head>
<body>

<!-- TITLE SCREEN -->

<div id="startScreen">

    <h1>🐑 SHEAR SPEED 🐑</h1>

    <h2>Ewe Got This!!</h2>

    <p>
        Jump over the fences and survive as long as possible.
    </p>

    <button onclick="startGame()">
        Start Game
    </button>

</div>

<!-- GAME -->

<div id="gameContainer" class="hidden">

    <div id="score">Score: 0</div>

    <div id="game">
        <div id="sheep">🐑</div>
    </div>

</div>

<!-- GAME OVER -->

<div id="gameOver" class="hidden">

    <h2 id="gameOverMessage"></h2>

    <p>
        Final Score:
        <span id="finalScore">0</span>
    </p>

    <button onclick="restartGame()">
        Play Again
    </button>

</div>

<script>

// VARIABLES

const game = document.getElementById("game");
const sheep = document.getElementById("sheep");
const scoreText = document.getElementById("score");

let score = 0;
let jumping = false;
let gameRunning = false;

let fences = [];

let gameLoop;
let fenceSpawner;

// START GAME

function startGame() {

    gameRunning = true;

    document
        .getElementById("startScreen")
        .classList.add("hidden");

    document
        .getElementById("gameContainer")
        .classList.remove("hidden");

    gameLoop = setInterval(updateGame, 20);
    fenceSpawner = setInterval(createFence, 2000);
}

// JUMP FUNCTION

function jump() {

    if (jumping || !gameRunning) return;

    jumping = true;

    sheep.style.bottom = "180px";

    setTimeout(() => {

        sheep.style.bottom = "30px";
        jumping = false;

    }, 600);
}

// CREATE FENCE

function createFence() {

    if (!gameRunning) return;

    const fence = document.createElement("div");

    fence.classList.add("fence");
    fence.style.left = "900px";

    game.appendChild(fence);

    fences.push(fence);
}

// UPDATE GAME

function updateGame() {

    for (let i = 0; i < fences.length; i++) {

        let fence = fences[i];
        let position = parseInt(fence.style.left);

        position -= 6;

        fence.style.left = position + "px";

        // Collision Detection

        if (
            position > 90 &&
            position < 150 &&
            !jumping
        ) {
            endGame();
        }

        // Score

        if (position === 120) {

            score++;

            scoreText.textContent =
                "Score: " + score;
        }

        // Remove old fences

        if (position < -50) {

            fence.remove();

            fences.splice(i, 1);

            i--;
        }
    }
}

// GAME OVER

function endGame() {

    gameRunning = false;

    clearInterval(gameLoop);
    clearInterval(fenceSpawner);

    const messages = [
        "Baa-d Luck!",
        "Wool You Try Again?",
        "Fence-tastically Unlucky!",
        "That's the Last Straw!",
        "Ewe Got Distracted!"
    ];

    let randomMessage =
        messages[Math.floor(Math.random() * messages.length)];

    document.getElementById("gameOverMessage")
        .textContent = randomMessage;

    document.getElementById("finalScore")
        .textContent = score;

    document.getElementById("gameOver")
        .classList.remove("hidden");
}

// RESTART

function restartGame() {
    location.reload();
}

// KEYBOARD CONTROLS

document.addEventListener("keydown", function(event) {

    if (event.code === "Space") {

        event.preventDefault();

        jump();
    }

});

</script>

</body>
</html>
